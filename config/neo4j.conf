# =========================================================
# neo4j.conf — Configuration du serveur Neo4j
# Projet : Plateforme d'analyse des réclamations clients
# =========================================================

# --- Réseau ---
server.default_listen_address=0.0.0.0
server.bolt.enabled=true
server.bolt.listen_address=:7687
server.http.enabled=true
server.http.listen_address=:7474

# --- Mémoire (à adapter selon le volume de réclamations attendu) ---
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1G
server.memory.pagecache.size=512m

# --- Sécurité ---
dbms.security.auth_enabled=true
# Autorise APOC et GDS (procédures étendues nécessaires pour l'analyse : similarité, PageRank, etc.)
dbms.security.procedures.unrestricted=apoc.*,gds.*
dbms.security.procedures.allowlist=apoc.*,gds.*

# --- Journalisation des requêtes lentes (utile pour optimiser les requêtes critiques) ---
db.logs.query.enabled=INFO
db.logs.query.threshold=1s

# --- Import de données ---
server.directories.import=import
# Autorise LOAD CSV depuis le dossier import/ monté par docker-compose
dbms.security.allow_csv_import_from_file_urls=true

# --- Transactions ---
db.transaction.timeout=60s
